<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irfan Quest</title>
<meta name="description" content="Mohammad Irfan Sirkar, ML developer from Hyderabad. A playable pixel-art portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" aria-label="Irfan Quest game world" tabindex="-1"></canvas>

<div id="hud" hidden>
  <div class="hud-card hud-player">
    <canvas id="portrait" width="16" height="20"></canvas>
    <div class="hud-stats">
      <div class="hud-name">IRFAN <span id="hudLv">LV 1</span></div>
      <div class="xpbar"><i id="hudXp"></i></div>
      <div class="hud-small" id="hudXpText">0 / 80 XP</div>
    </div>
    <div class="hud-counts">
      <span title="Data Crystals (projects) found"><b class="ico ico-crystal"></b><span id="hudC">0/8</span></span>
      <span title="Bugs squashed"><b class="ico ico-bug"></b><span id="hudB">0/7</span></span>
    </div>
  </div>
  <nav class="hud-btns" aria-label="Menus">
    <button type="button" data-act="quests"><kbd>Q</kbd>Quests</button>
    <button type="button" data-act="dex"><kbd>I</kbd>Projects</button>
    <button type="button" data-act="skills"><kbd>K</kbd>Skills</button>
    <button type="button" data-act="resume"><kbd>R</kbd>Resume</button>
    <button type="button" data-act="sound" id="btnSound" aria-pressed="true"><kbd>M</kbd><span id="soundLabel">Sound on</span></button>
  </nav>
  <div id="objective"></div>
</div>

<canvas id="minimap" hidden aria-hidden="true"></canvas>

<div id="dialog" hidden>
  <canvas id="dlgFace" width="16" height="20"></canvas>
  <div class="dlg-main">
    <div class="dlg-name" id="dlgName"></div>
    <p class="dlg-text" id="dlgText" aria-live="polite"></p>
    <div class="dlg-choices" id="dlgChoices"></div>
  </div>
  <span class="dlg-next" id="dlgNext" hidden>▼</span>
</div>

<div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <div class="panel-box">
    <header><h2 id="panelTitle"></h2><button type="button" id="panelClose" aria-label="Close">✕</button></header>
    <div id="panelBody"></div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<div id="touch" hidden>
  <div id="stick"><i></i></div>
  <button type="button" id="btnA" aria-label="Talk or interact">A</button>
</div>

<div id="title">
  <div class="title-box">
    <p class="title-kicker">A playable portfolio</p>
    <h1>IRFAN<span>QUEST</span></h1>
    <p class="title-sub">Mohammad Irfan Sirkar · ML Developer · Hyderabad</p>
    <div class="title-btns">
      <button type="button" id="btnStart" class="btn-primary">▶ Start quest</button>
      <button type="button" id="btnNew" class="btn-ghost" hidden>New game</button>
      <button type="button" id="btnSkip" class="btn-ghost">Recruiter? View resume</button>
    </div>
    <p class="title-help">WASD or arrows to move · E or Space to talk · or tap where you want to go</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
